<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>charity: water - A Drop of Hope</title>
  <!-- Link to the CSS file -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Main container for the landing page -->
  <div class="hero" style="display: flex; align-items: stretch; justify-content: center; min-height: 400px; background-image: url('img/wave.jpg'); background-size: cover;">
    <!-- Left: Logo at the top, headlines centered below -->
    <div class="hero-left">
      <!-- Logo at the top left -->
      <img src="img/cw_logo-2.png" alt="charity: water logo" class="logo-img">
      <!-- Headline and subheadline centered in white space -->
      <div class="headline-group">
        <h1 class="main-headline">A Drop<br>of Hope</h1>
        <p class="subheadline">Every dollar makes a wave—<br>See the hope it helps to pave!</p>
        <!-- Call-to-action button -->
        <button class="cta-button">See Your Impact</button>
      </div>
    </div>
    <!-- Kid's photo on the right -->
    <div class="hero-right" style="display: flex; align-items: flex-end;">
      <img src="img/photo1.jpg" alt="Child at water tap" class="impact-photo">
    </div>
  </div>
</body>
</html>
