<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>charity: water - A Drop of Hope</title>
  <!-- Link to the CSS file -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Main container for the hero section -->
  <section class="hero" style="display: flex; align-items: stretch; justify-content: center; min-height: 400px; position: relative;">
    <!-- Left side: Text content -->
    <div style="flex: 1; min-width: 220px; max-width: 480px; z-index: 1; background: rgba(255,255,255,0.85); border-radius: 12px; padding: 32px 24px; margin: 24px 0 24px 24px;">
      <!-- Logo at the top -->
      <img src="img/cw_logo-2.png" alt="charity: water logo" class="logo-img">
      <!-- Main heading -->
      <h1 class="main-headline">A Drop of Hope</h1>
      <!-- Subheadline -->
      <p class="subheadline">Every dollar makes a wave—<br>See the hope it helps to pave!</p>
    </div>
    <!-- Right side: Image, flush to the right edge -->
    <div style="flex: 1; display: flex; justify-content: flex-end; align-items: stretch; margin: 0; padding: 0;">
      <!-- Impact photo, no border radius, no white space -->
      <img src="img/photo1.jpg" alt="Child at water tap" class="impact-photo" style="height: 100%; object-fit: cover; border-radius: 0; margin: 0; padding: 0;">
    </div>
  </section>
</body>
</html>
